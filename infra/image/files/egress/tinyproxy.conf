# Egress proxy for the agent. Only reachable on loopback; only allowlisted hosts pass.
User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Timeout 600
MaxClients 100
Allow 127.0.0.1

# Only HTTPS tunnels; plain-HTTP requests are still domain-filtered.
ConnectPort 443

Filter "/etc/rootorroute/egress/allowlist.compiled"
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
FilterDefaultDeny Yes

LogLevel Notice
LogFile "/var/log/tinyproxy/tinyproxy.log"
PidFile "/run/tinyproxy/tinyproxy.pid"
DisableViaHeader Yes
